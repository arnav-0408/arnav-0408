<svg xmlns="http://www.w3.org/2000/svg"
    width="770"
    height="740"
    viewBox="0 0 770 740">

    <style>

        .row {
            opacity: 0;
            animation: reveal 0.28s ease-out forwards;
        }

        @keyframes reveal {

            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        text {
            font-family:
                "Courier New",
                monospace;

            font-size: 10px;
            font-weight: bold;
            fill: #c9d1d9;
        }

    </style>
    
